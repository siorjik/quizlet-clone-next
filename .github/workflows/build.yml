name: Build checking

on:
  push:
    branches: development
  pull_request:
    branches: development
  workflow_dispatch:

jobs:
  check-build:
    runs-on: ubuntu-latest
    environment: prod
    steps:
      - name: Get code
        uses: actions/checkout@v4
      
      - name: Create .env file
        env:
          APP_ENV: ${{ vars.APP_ENV }}
          API_HOST: ${{ secrets.API_HOST }}
          NEXT_PUBLIC_APP_HOST: ${{ secrets.NEXT_PUBLIC_APP_HOST }}
          NEXTAUTH_SECRET: ${{ secrets.NEXTAUTH_SECRET }}
          NEXTAUTH_URL: ${{ secrets.NEXTAUTH_URL }}
          STORAGE_ACCESS_KEY: ${{ secrets.STORAGE_ACCESS_KEY }}
          STORAGE_ACCESS_KEY_ID: ${{ secrets.STORAGE_ACCESS_KEY_ID }}
          STORAGE_ID: ${{ secrets.STORAGE_ID }}
          STORAGE_NAME: ${{ secrets.STORAGE_NAME }}
        run: |
          echo "APP_ENV=${APP_ENV}" > .env
          echo "API_HOST=${API_HOST}" >> .env
          echo "NEXT_PUBLIC_APP_HOST=${NEXT_PUBLIC_APP_HOST}" >> .env
          echo "NEXTAUTH_SECRET=${NEXTAUTH_SECRET}" >> .env
          echo "NEXTAUTH_URL=${NEXTAUTH_URL}" >> .env
          echo "STORAGE_ACCESS_KEY=${STORAGE_ACCESS_KEY}" >> .env
          echo "STORAGE_ACCESS_KEY_ID=${STORAGE_ACCESS_KEY_ID}" >> .env
          echo "STORAGE_ID=${STORAGE_ID}" >> .env
          echo "STORAGE_NAME=${STORAGE_NAME}" >> .env

      - name: Create cypress.env.json file
        env:
          CYPRESS_APP_URL: ${{ secrets.CYPRESS_APP_URL }}
          CYPRESS_EMAIL: ${{ secrets.CYPRESS_EMAIL }}
          CYPRESS_PASSWORD: ${{ secrets.CYPRESS_PASSWORD }}
        run: |
          echo '{
            "appUrl": "'"$CYPRESS_APP_URL"'",
            "email": "'"$CYPRESS_EMAIL"'",
            "password": "'"$CYPRESS_PASSWORD"'"
          }' > cypress.env.json

      - name: Check env file
        run: cat .env

      - name: Check cypress env file
        run: cat cypress.env.json

      - name: Yarn install
        run: yarn install
        
      - name: Check build
        run: yarn build

      - name: Check unit tests
        run: yarn jest

      # - name: Check e2e tests
      #   run: yarn cypress run

      - name: Check e2e tests
        uses: cypress-io/github-action@v6
        with:
          build: yarn build
          start: yarn start
          # wait-on: 'http://localhost:3000'
          browser: chrome
        
      - name: Build the docker image
        run: docker build .